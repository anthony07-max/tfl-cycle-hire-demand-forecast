name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Feature pipeline tests
        run: pytest -q
      - name: Saved model loads and predicts
        run: |
          python -c "import joblib, pandas as pd; m = joblib.load('models/lgbm_cycle_hires.joblib'); f = pd.read_csv('data/processed/features.csv').dropna(subset=m['features']); print(m['model'].predict(f[m['features']].tail(3)))"
